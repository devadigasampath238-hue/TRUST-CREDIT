<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login - Trust Credit</title>
<style>
  * { box-sizing: border-box; }

  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.08); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fieldIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif;
    background: #0B1E3F;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
  }

  /* Soft floating glow blobs in the background for a bit of life */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 340px; height: 340px;
    background: #2E9E3E;
    top: -80px; left: -80px;
    animation: floatBlob 14s ease-in-out infinite;
  }
  body::after {
    width: 300px; height: 300px;
    background: #3E6FD9;
    bottom: -60px; right: -60px;
    animation: floatBlob 16s ease-in-out infinite reverse;
  }

  .login-card {
    position: relative;
    z-index: 1;
    background: #fff;
    padding: 40px 36px;
    border-radius: 14px;
    width: 100%; max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: cardIn 0.5s ease-out;
  }

  .login-card.shake {
    animation: cardIn 0.5s ease-out, shake 0.4s ease-in-out;
  }

  .badge {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2E9E3E, #257d31);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 6px 16px rgba(46,158,62,0.35);
  }
  .badge svg { width: 26px; height: 26px; }

  h1 {
    margin: 0 0 4px; font-size: 22px; color: #0B1E3F;
    text-align: center;
  }
  p.sub {
    margin: 0 0 26px; color: #667; font-size: 14px;
    text-align: center;
  }

  .field {
    animation: fieldIn 0.45s ease-out both;
  }
  .field:nth-of-type(1) { animation-delay: 0.05s; }
  .field:nth-of-type(2) { animation-delay: 0.12s; }

  label {
    display: block; font-size: 13px; font-weight: bold;
    color: #0B1E3F; margin-bottom: 6px;
  }

  .input-wrap { position: relative; margin-bottom: 18px; }

  input {
    width: 100%; padding: 10px 12px; padding-right: 38px;
    border: 1.5px solid #dde; border-radius: 8px; font-size: 14px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    outline: none;
  }
  input:focus {
    border-color: #2E9E3E;
    box-shadow: 0 0 0 3px rgba(46,158,62,0.15);
  }

  .toggle-pass {
    position: absolute;
    right: 10px; top: 50%; transform: translateY(-50%);
    cursor: pointer;
    background: none; border: none; padding: 4px;
    width: auto; color: #99a;
    font-size: 12px; font-weight: bold;
  }
  .toggle-pass:hover { background: none; color: #556; }

  button[type="submit"] {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #2E9E3E; color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer;
    position: relative;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button[type="submit"]:hover { background: #257d31; }
  button[type="submit"]:active { transform: scale(0.98); }
  button[type="submit"]:disabled {
    background: #257d31; cursor: default; opacity: 0.85;
  }

  .spinner {
    display: none;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    position: absolute;
    left: 50%; top: 50%;
    margin-left: -8px; margin-top: -8px;
  }
  button[type="submit"].loading .btn-text { visibility: hidden; }
  button[type="submit"].loading .spinner { display: block; }

  .error {
    background: #ffe6e6; color: #c0392b; padding: 10px 12px;
    border-radius: 8px; font-size: 13px; margin-bottom: 18px;
    animation: fieldIn 0.35s ease-out;
  }
</style>
</head>
<body>
  <div class="login-card" id="loginCard">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Trust Credit Admin</h1>
    <p class="sub">Sign in to manage loan applications</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_login') }}" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" required autofocus
                 autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" required
                 autocapitalize="none" autocorrect="off" spellcheck="false">
          <button type="button" class="toggle-pass" id="togglePass" tabindex="-1">SHOW</button>
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <span class="btn-text">Login</span>
        <span class="spinner"></span>
      </button>
    </form>
  </div>

  <script>
    // Show/hide password
    var pass = document.getElementById('password');
    var toggle = document.getElementById('togglePass');
    toggle.addEventListener('click', function () {
      var isHidden = pass.type === 'password';
      pass.type = isHidden ? 'text' : 'password';
      toggle.textContent = isHidden ? 'HIDE' : 'SHOW';
    });

    // Loading state on submit (spinner in the button while the request runs)
    var form = document.getElementById('loginForm');
    var btn = document.getElementById('submitBtn');
    form.addEventListener('submit', function () {
      btn.classList.add('loading');
      btn.disabled = true;
    });

    // Little shake on the card if the server sent back an error
    {% if error %}
      var card = document.getElementById('loginCard');
      card.classList.add('shake');
    {% endif %}
  </script>
</body>
</html>
